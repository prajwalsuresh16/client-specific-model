# Multi-task Workflow — mirrors notebooks 00–08 + SQL + DLT + serving
resources:
  jobs:
    fmg_modeling_e2e:
      name: FMG Regional Bank Modeling E2E
      email_notifications:
        on_failure:
          - ${var.notification_email}
      job_clusters:
        - job_cluster_key: modeling_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS4_v2
            num_workers: 2
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]

      tasks:
        - task_key: setup_catalog
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/00_setup_catalog.sql
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: synthetic_bronze
          depends_on:
            - task_key: setup_catalog
          job_cluster_key: modeling_cluster
          notebook_task:
            notebook_path: ../notebooks/00_synthetic_data_regional_bank.py
            base_parameters:
              uc_catalog: ${var.catalog}
              uc_schema: ${var.schema}

        - task_key: dlt_medallion
          depends_on:
            - task_key: synthetic_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.fmg_medallion.id}

        - task_key: step01_mrgal
          depends_on:
            - task_key: synthetic_bronze
          job_cluster_key: modeling_cluster
          notebook_task:
            notebook_path: ../notebooks/01_auto_mrgal_creation.py

        - task_key: step02_sample_prep
          depends_on:
            - task_key: step01_mrgal
          job_cluster_key: modeling_cluster
          notebook_task:
            notebook_path: ../notebooks/02_auto_sample_prep.py

        - task_key: step03_modeling
          depends_on:
            - task_key: step02_sample_prep
          job_cluster_key: modeling_cluster
          notebook_task:
            notebook_path: ../notebooks/03_feature_engineering_and_live_modeling.py

        - task_key: step04_validation
          depends_on:
            - task_key: step03_modeling
          job_cluster_key: modeling_cluster
          notebook_task:
            notebook_path: ../notebooks/04_auto_validation_framework.py

        - task_key: step05_recommendation
          depends_on:
            - task_key: step04_validation
          job_cluster_key: modeling_cluster
          notebook_task:
            notebook_path: ../notebooks/05_auto_recommendations.py

        - task_key: step06_rank_mix
          depends_on:
            - task_key: step05_recommendation
          job_cluster_key: modeling_cluster
          notebook_task:
            notebook_path: ../notebooks/06_dynamic_rank_mix_scoring.py

        - task_key: step07_lol
          depends_on:
            - task_key: step06_rank_mix
          job_cluster_key: modeling_cluster
          notebook_task:
            notebook_path: ../notebooks/07_auto_lol_generation.py

        - task_key: step08_so_output
          depends_on:
            - task_key: step07_lol
          job_cluster_key: modeling_cluster
          notebook_task:
            notebook_path: ../notebooks/08_names_selection_and_so_load.py

        - task_key: dashboard_sql_refresh
          depends_on:
            - task_key: step08_so_output
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/01_dashboard_kpis.sql
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: deploy_model_serving
          depends_on:
            - task_key: step05_recommendation
          job_cluster_key: modeling_cluster
          notebook_task:
            notebook_path: ../notebooks/09_model_serving_and_monitoring.py
